name: Card claim manual
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation (submit-once needs explicit confirmation)
        type: choice
        options: [inspect, eligibility, submit-once]
        default: inspect
      confirm_submit:
        description: Confirm one free order for the configured target
        type: boolean
        default: false
      verify_new_egress:
        description: Require a different observed public IPv4 from the test job
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: card-claim-single
  cancel-in-progress: false
jobs:
  test:
    outputs:
      egress_fingerprint: ${{ steps.egress.outputs.fingerprint }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: c5292c81b63b0d83671656b04ec33404f3e0923f
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe baseline egress without submitting
        if: inputs.verify_new_egress
        id: egress
        uses: actions/github-script@v7
        with:
          script: |
            const { createHash } = require('node:crypto');
            const r = await fetch('https://api.ipify.org?format=json', {signal: AbortSignal.timeout(15000)});
            if (!r.ok) throw new Error('Egress observation unavailable');
            const {ip} = await r.json();
            if (require('node:net').isIP(ip || '') !== 4) throw new Error('Expected IPv4');
            const fingerprint = createHash('sha256').update(process.env.GITHUB_RUN_ID + ':' + ip).digest('hex');
            core.setOutput('fingerprint', fingerprint);
            core.info('BASELINE_EGRESS_OBSERVED true; no order submitted');
      - name: Check syntax and behavioral safeguards
        run: |
          node --check Tools/card-claim.cjs
          node --check Tools/card-claim-core.cjs
          node --test Tests/card-claim.test.cjs
  inspect:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: c5292c81b63b0d83671656b04ec33404f3e0923f
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify independent runner egress
        if: inputs.verify_new_egress
        uses: actions/github-script@v7
        env:
          BASELINE_EGRESS: ${{ needs.test.outputs.egress_fingerprint }}
        with:
          script: |
            const { createHash } = require('node:crypto');
            const r = await fetch('https://api.ipify.org?format=json', {signal: AbortSignal.timeout(15000)});
            if (!r.ok) throw new Error('Egress observation unavailable');
            const {ip} = await r.json();
            if (require('node:net').isIP(ip || '') !== 4) throw new Error('Expected IPv4');
            const fingerprint = createHash('sha256').update(process.env.GITHUB_RUN_ID + ':' + ip).digest('hex');
            const baseline = process.env.BASELINE_EGRESS;
            if (!baseline || baseline === fingerprint) throw new Error('Different egress not verified; no order will be submitted');
            core.info('EGRESS_DIFFERENT_FROM_BASELINE true');
            await core.summary.addRaw('Public IPv4 differs from the baseline job in this run. Previous claim IP was not recorded. This does not prove the provider uses IP-only limits.').write();
      - name: Install browser
        run: |
          mkdir -p "$RUNNER_TEMP/card-claim"
          cd "$RUNNER_TEMP/card-claim"
          npm install --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Requested single operation
        env:
          NODE_PATH: ${{ runner.temp }}/card-claim/node_modules
          CLAIM_MODE: ${{ inputs.mode }}
          CLAIM_ALLOW_SUBMIT: ${{ inputs.confirm_submit && inputs.mode == 'submit-once' && 'true' || 'false' }}
          QQ_CARD_CLAIM_TARGET: ${{ secrets.QQ_CARD_CLAIM_TARGET }}
        run: node Tools/card-claim.cjs
      - name: Save sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-claim-result-${{ github.run_id }}
          path: results/card-claim.json
          retention-days: 7
          if-no-files-found: warn
