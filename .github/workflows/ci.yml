name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-tests:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Compile and exercise guarded Objective-C hooks
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -I Sources Sources/QARHook.m Tests/HookTests.m -framework Foundation -o "$RUNNER_TEMP/hook-tests"
          "$RUNNER_TEMP/hook-tests"
